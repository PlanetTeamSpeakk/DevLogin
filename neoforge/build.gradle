plugins {
    id "com.gradleup.shadow" version "9.4.2"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin because we don't want IDEA to index this.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.neoforged.net/releases/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive = false }
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 17
}

// The NeoForge libraries we compile against are published for Java 21, but we
// emit Java 17 bytecode (see options.release above) so the mod also loads on
// older, Java 17-based NeoForge versions. Setting release = 17 makes Gradle
// request Java 17-compatible dependency variants, which the Java 21-only NeoForge
// libraries don't provide, failing resolution. Since the build itself runs on
// Java 21, we resolve dependencies as if running on Java 21 so their variants are
// accepted, while javac keeps targeting release 17 above.
def targetJvmVersion = org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE
configurations.configureEach {
    if (canBeResolved) attributes.attribute(targetJvmVersion, 21)
}

processResources {
    inputs.property "version", project.version

    filesMatching(["META-INF/neoforge.mods.toml", "META-INF/mods.toml"]) {
        expand "version": project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

jar {
    archiveClassifier = "dev"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
