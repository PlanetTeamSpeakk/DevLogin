import java.util.stream.Stream

plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom" version "1.17-SNAPSHOT" apply false
    id "maven-publish"
    id "signing"
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        mappings loom.officialMojangMappings()

        // https://mvnrepository.com/artifact/org.asynchttpclient/async-http-client
        implementation "org.asynchttpclient:async-http-client:${rootProject.async_http_version}"
    }

    // Doesn't seem to work with the next subprojects block if I put this in common/build.gradle
    if (project.name == "common")
        java {
            withJavadocJar()
        }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"

    base.archivesName = rootProject.archives_base_name
    version = rootProject.mod_version
    group = rootProject.maven_group

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 8
    }
}

// Has to be a separate block.
// It has to be done after withSourcesJar(),
// but the first subprojects bock needs
// to be done before the allprojects block.
subprojects {
    if (project.name != "common") {
        remapJar {
            archiveClassifier = project.name
        }

        // SOMETHING is setting the archive classifier of sourcesJar back to 'sources'
        // I do not know WHAT, but we just make our own instead.
        tasks.register("sourcesJar1", Jar) {
            dependsOn classes
            archiveClassifier = "${project.name}-sources"
            from sourceSets.main.allSource
            from project(":common").sourceSets.main.allSource
        }

        tasks.register("javadocJar", Jar) {
            archiveClassifier = "${project.name}-javadoc"
            from zipTree(project(":common").tasks.getByName("javadocJar").archiveFile)
        }

        jar {
            // To ensure both are built.
            dependsOn sourcesJar1
            dependsOn javadocJar
        }
    }
}

// Define artifacts for each subproject.
def atfs = subprojects.collect()
        .stream()
        .filter { it.name != "common" }
        .flatMap {
            Stream.of(it.tasks.getByName("remapJar").outputs.getFiles().getSingleFile(),
                    it.tasks.getByName("sourcesJar1").outputs.getFiles().getSingleFile(),
                    it.tasks.getByName("javadocJar").outputs.getFiles().getSingleFile())
        }.map { artifacts.add("archives", it) }

publishing {
    publications {
        mavenJava(MavenPublication) {
            pom {
                name = 'DevLogin'
                artifactId = 'devlogin'
                description = 'Login with your own Minecraft account in a mod development environment.'
                url = 'https://github.com/PlanetTeamSpeakk/DevLogin'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://raw.githubusercontent.com/PlanetTeamSpeakk/DevLogin/main/LICENSE'
                    }
                }
                developers {
                    developer {
                        id = 'PlanetTeamSpeak'
                        name = 'PlanetTeamSpeak'
                        email = 'PlanetTeamSpeakk@users.noreply.github.com'
                    }
                }
                scm {
                    connection = 'scm:git:https://github.com/PlanetTeamSpeakk/DevLogin.git'
                    developerConnection = 'scm:git:git@github.com:PlanetTeamSpeakk/DevLogin.git'
                    url = 'https://github.com/PlanetTeamSpeakk/DevLogin'
                }
                issueManagement {
                    system = "GitHub"
                    url = "https://github.com/PlanetTeamSpeakk/DevLogin/issues"
                }

                // Because we use a custom artifact made from the merged jar file,
                // the single dependency we have is not recognized.
                // Hence we manually add this dependency to the dependencies of this project.
                withXml {
                    def depsNode = asNode().appendNode("dependencies")
                    def depNode = depsNode.appendNode("dependency")

                    depNode.appendNode("groupId", "org.asynchttpclient")
                    depNode.appendNode("artifactId", "async-http-client")
                    depNode.appendNode("version", "2.12.3")
                }
            }

            // add all the jars that should be included when publishing to maven
            atfs.forEach { artifact it }
//            artifact project(":fabric").tasks.getByName("remapJar").outputs.getFiles().getSingleFile()
//            artifact project(":fabric").tasks.getByName("sourcesJar1").outputs.getFiles().getSingleFile()
//            artifact project(":fabric").tasks.getByName("javadocJar").outputs.getFiles().getSingleFile()

//            artifact project(":quilt").tasks.getByName("remapJar").outputs.getFiles().getSingleFile()
//            artifact project(":quilt").tasks.getByName("sourcesJar1").outputs.getFiles().getSingleFile()
//            artifact project(":quilt").tasks.getByName("javadocJar").outputs.getFiles().getSingleFile()

//            artifact project(":forge").tasks.getByName("remapJar").outputs.getFiles().getSingleFile()
//            artifact project(":forge").tasks.getByName("sourcesJar1").outputs.getFiles().getSingleFile()
//            artifact project(":forge").tasks.getByName("javadocJar").outputs.getFiles().getSingleFile()

//            artifact project(":neoforge").tasks.getByName("remapJar").outputs.getFiles().getSingleFile()
//            artifact project(":neoforge").tasks.getByName("sourcesJar1").outputs.getFiles().getSingleFile()
//            artifact project(":neoforge").tasks.getByName("javadocJar").outputs.getFiles().getSingleFile()
        }
    }

    repositories {
        mavenLocal()
        maven {
            name "MavenCentral"
            url "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
            credentials {
                username ossrhUsername
                password ossrhPassword
            }
        }
        maven {
            name "GithubPackages"
            url ghUrlRoot + "/DevLogin"
            credentials {
                username ghUsername
                password ghToken
            }
        }
    }
}

signing {
    sign publishing.publications.mavenJava
}
